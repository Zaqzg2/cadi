name: Android CI - Build Debug APK

# Matches the pipeline: push to GitHub -> this workflow -> Build APK -> download & sideload to test.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Build-time settings baked into the APK (all optional — blank values fall back to placeholders and the app then says
    # exactly what is missing). Add them under GitHub > Settings > Secrets and variables > Actions:
    #   BACKEND_BASE_URL   the deployed backend, e.g. https://inventory-smart-ai-backend.onrender.com/
    #   BACKEND_APP_KEY    the backend's APP_API_KEY
    #   GOOGLE_BACKEND_SERVER_CLIENT_ID   the Web OAuth client id (only for the Google Workspace features)
    # The debug APK this workflow produces uses the same backend URL as a release build would.
    env:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      BACKEND_BASE_URL_DEBUG: ${{ secrets.BACKEND_BASE_URL }}
      BACKEND_APP_KEY: ${{ secrets.BACKEND_APP_KEY }}
      GOOGLE_BACKEND_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_BACKEND_SERVER_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # The sandbox this project was generated in has no network access, so it could not
      # download the real gradle-wrapper.jar binary. This step regenerates it for real,
      # using a genuine Gradle install with internet access — the same one-line fix you'd
      # run locally (`gradle wrapper`), just automated here.
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.14.4 --distribution-type bin

      # The APK is built FIRST and on its own, so a red unit test can never stop you from installing and trying the app:
      # the run still ends red (see "Fail job" below) and the APK is still uploaded. (Earlier versions ran every test before
      # assembling, which meant one failing test - in either module - produced no APK at all.)
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Run app unit tests
        id: app_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test-output.log
        continue-on-error: true

      - name: Run backend unit tests
        id: backend_tests
        run: |
          set -o pipefail
          ./gradlew :backend:test --stacktrace 2>&1 | tee backend-test-output.log
        continue-on-error: true

      # Builds the backend's full Ktor application distribution (a plain JVM app, not an Android artifact) - confirms it
      # assembles end to end, beyond what running its unit tests alone verifies. Needs no secrets: ServerConfig reads the
      # environment only when the server starts, never at build time - see backend/README.md.
      - name: Build backend
        id: build_backend
        run: |
          set -o pipefail
          ./gradlew :backend:installDist -x test --stacktrace 2>&1 | tee backend-build-output.log
        continue-on-error: true

      # Deployment check: the same Dockerfile the hosting platforms use. Informational only (it never blocks the APK) - a
      # failure here means "fix this before deploying", and shows up as a warning on the run.
      - name: Build backend Docker image (deployment check)
        id: docker_build
        run: |
          set -o pipefail
          docker build -t inventory-smart-ai-backend . 2>&1 | tee docker-build-output.log
        continue-on-error: true

      - name: Warn if the Docker image did not build
        if: steps.docker_build.outcome == 'failure'
        run: echo "::warning::The backend Docker image failed to build - see the 'Build backend Docker image' step before deploying."

      - name: Collect failure logs
        if: steps.build.outcome == 'failure' || steps.app_tests.outcome == 'failure' || steps.backend_tests.outcome == 'failure' || steps.build_backend.outcome == 'failure' || steps.docker_build.outcome == 'failure'
        run: |
          mkdir -p ci-failure-logs
          cp build-output.log ci-failure-logs/ 2>/dev/null || true
          cp unit-test-output.log ci-failure-logs/ 2>/dev/null || true
          cp backend-test-output.log ci-failure-logs/ 2>/dev/null || true
          cp backend-build-output.log ci-failure-logs/ 2>/dev/null || true
          cp docker-build-output.log ci-failure-logs/ 2>/dev/null || true
          [ -d app/build/reports ] && cp -r app/build/reports ci-failure-logs/app-build-reports
          [ -d backend/build/reports ] && cp -r backend/build/reports ci-failure-logs/backend-build-reports
          exit 0

      - name: Upload failure logs
        if: steps.build.outcome == 'failure' || steps.app_tests.outcome == 'failure' || steps.backend_tests.outcome == 'failure' || steps.build_backend.outcome == 'failure' || steps.docker_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: ci-failure-logs/
          if-no-files-found: warn

      # Upload the APK whenever it was built, even if something else in this run is red.
      - name: Upload APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: inventory-smart-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The Docker image is a deployment check only; everything else turns the run red when it fails.
      - name: Fail job if the APK, a test, or the backend build failed
        if: ${{ always() && (steps.build.outcome == 'failure' || steps.app_tests.outcome == 'failure' || steps.backend_tests.outcome == 'failure' || steps.build_backend.outcome == 'failure') }}
        run: exit 1
