# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# AGP 9.0+ ships "built-in Kotlin" and no longer allows the classic
# org.jetbrains.kotlin.android plugin unless this is set. This is Google's own documented,
# supported opt-out (removed only at AGP 10.0) — not a hack. See README for details.
android.builtInKotlin=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Arabic/RTL is the whole point of this app — keep resource merging predictable.
android.enableResourceOptimizations=true
