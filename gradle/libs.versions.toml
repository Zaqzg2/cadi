[versions]
# NOTE: these were the current stable versions at the time this project was generated.
# Android Studio will flag any that have since moved — accept its upgrade suggestions.
# Deliberately on the AGP 8.x line, not 9.x: AGP 9.0+ ships "built-in Kotlin" and (as of
# this writing) has open compatibility issues with Hilt. AGP 8.13.2 is mature, proven with
# Hilt/KSP/Compose, and needs no opt-out flags at all. Requires Gradle >= 8.13.
agp = "8.13.2"
# Hilt 2.58's bundled kotlin-metadata-jvm reader caps at metadata format 2.3.0 (confirmed by
# a real build error: "Provided Metadata instance has version 2.4.0, while maximum supported
# version is 2.3.0"). AGP 8.13 was also explicitly built/tested against the Kotlin 2.3 line,
# so this is a better match than 2.4.0, not just a workaround.
kotlin = "2.3.20"
ksp = "2.3.10"
# Rolled back from "latest" on purpose: androidx.core 1.19.0+, lifecycle 2.11.0+, and
# navigation-compose past a certain point all gate on compileSdk 37 / AGP 9.1+ via AAR
# metadata (confirmed against real build failures). These versions are the last ones
# confirmed to work with compileSdk 36 / AGP 8.13.2.
coreKtx = "1.16.0"
lifecycle = "2.10.0"
activityCompose = "1.10.1"
composeBom = "2026.04.01"
navigationCompose = "2.9.0"
# Hilt 2.59+ made AGP 9 mandatory and dropped AGP 8 support entirely — 2.58 is the last
# version compatible with the AGP 8.13.2 line used here, and already includes the
# Kotlin 2.3+ metadata fix needed for our Kotlin 2.3.20 (confirmed against google/dagger#5001;
# still current as of a live check against Dagger's own release notes).
hilt = "2.58"
hiltNavigationCompose = "1.3.0"
room = "2.8.4"
datastore = "1.1.3"
coroutines = "1.10.1"
# Phase 3: reads .xlsx. Verified on Maven Central (org.dhatim:fastexcel-reader) — Apache POI is
# only a `test`-scope dependency of this artifact, not pulled in at runtime, and it depends only
# on aalto-xml (a self-contained StAX implementation, not Android's broken javax.xml.stream stub)
# and commons-compress, both plain Java with no java.awt/javax.swing use. ":fastexcel" (no
# "-reader" suffix) is the same project's writer, used only from unit tests to generate .xlsx
# fixtures — never shipped in the app itself.
fastexcel = "0.20.2"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
espressoCore = "3.6.1"

# --- Phase 4: AI + Google ecosystem. Every version below was checked against a real, currently
# published release (Maven Central / Google's Maven) before being pinned here — see the Phase 4
# section of README.md for the sources — never a reconstructed-from-pattern guess (rule zero).
# Networking (app -> backend only; the app never talks to Gemini or Google APIs directly).
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"
# Google Sign-In has moved to Credential Manager (authentication) + AuthorizationClient
# (authorization/scopes) — the legacy GoogleSignInClient in play-services-auth is deprecated.
playServicesAuth = "22.0.0" # verified against the live developer.android.com/identity/authorization page (English canonical, fetched directly rather than trusting an older cached/localized snapshot that showed 21.5.0/21.5.1)
# Backend module (plain Kotlin/JVM, never bundled into the APK).
ktor = "3.5.2"
kotlinxSerializationJson = "1.11.0"
logback = "1.5.37"

